name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Process handling differs per OS (POSIX process groups vs. Windows job objects), so the
    # runner is tested on all three.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The oldest supported Node.js and the current LTS.
        node: ['20.19', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: xvfb-run -a npm run test:integration
      # Packaging runs the type check and build, and fails on manifest problems.
      - run: npm run package
