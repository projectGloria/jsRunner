<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 210" width="860" height="210">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1E2E"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#6C7086"/>
    </marker>
  </defs>

  <!-- Step 1: Select Code -->
  <g transform="translate(15, 20)" filter="url(#cardShadow)">
    <rect width="185" height="165" rx="8" fill="url(#cardGrad)" stroke="#313244" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#313244"/>
    <text x="26" y="31" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="bold" font-size="14" fill="#F7DF1E" text-anchor="middle">1</text>
    <text x="50" y="31" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="bold" font-size="14" fill="#CDD6F4">Select Code</text>
    
    <text x="14" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#BAC2DE">Highlight snippet</text>
    <text x="14" y="86" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#BAC2DE">in any JS/TS file.</text>
    <text x="14" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#A6ADC8">• Unsaved edits included</text>
    <text x="14" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#A6ADC8">• Markdown, HTML, Vue</text>
    <text x="14" y="148" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#89B4FA">• Shortcut: Ctrl+Alt+J</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <line x1="205" y1="102" x2="228" y2="102" stroke="#6C7086" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: AST & Scope Closure -->
  <g transform="translate(233, 20)" filter="url(#cardShadow)">
    <rect width="185" height="165" rx="8" fill="url(#cardGrad)" stroke="#313244" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#313244"/>
    <text x="26" y="31" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="bold" font-size="14" fill="#89B4FA" text-anchor="middle">2</text>
    <text x="50" y="31" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="bold" font-size="14" fill="#CDD6F4">Analyze Scope</text>
    
    <text x="14" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#BAC2DE">Acorn AST parser extracts</text>
    <text x="14" y="86" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#BAC2DE">referenced bindings.</text>
    <text x="14" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#A6ADC8">• Only used declarations</text>
    <text x="14" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#A6ADC8">• Selective imports</text>
    <text x="14" y="148" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#A6ADC8">• Zero side-effects run</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <line x1="423" y1="102" x2="446" y2="102" stroke="#6C7086" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Isolated Node Process -->
  <g transform="translate(451, 20)" filter="url(#cardShadow)">
    <rect width="185" height="165" rx="8" fill="url(#cardGrad)" stroke="#313244" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#313244"/>
    <text x="26" y="31" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="bold" font-size="14" fill="#A6E3A1" text-anchor="middle">3</text>
    <text x="50" y="31" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="bold" font-size="14" fill="#CDD6F4">Run in Node</text>
    
    <text x="14" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#BAC2DE">Fresh Node.js process</text>
    <text x="14" y="86" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#BAC2DE">runs snippet safely.</text>
    <text x="14" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#A6ADC8">• Strict ES Module mode</text>
    <text x="14" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#A6ADC8">• Top-level await support</text>
    <text x="14" y="148" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#A6ADC8">• Configurable timeout</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <line x1="641" y1="102" x2="664" y2="102" stroke="#6C7086" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Stream Results -->
  <g transform="translate(669, 20)" filter="url(#cardShadow)">
    <rect width="176" height="165" rx="8" fill="url(#cardGrad)" stroke="#313244" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#313244"/>
    <text x="26" y="31" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="bold" font-size="14" fill="#F38BA8" text-anchor="middle">4</text>
    <text x="50" y="31" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="bold" font-size="14" fill="#CDD6F4">Stream Output</text>
    
    <text x="14" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#BAC2DE">Dedicated Webview tab</text>
    <text x="14" y="86" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#BAC2DE">streams live output.</text>
    <text x="14" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#A6ADC8">• Status &amp; line ranges</text>
    <text x="14" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#A6ADC8">• Deep object inspector</text>
    <text x="14" y="148" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#A6ADC8">• One-click Copy Result</text>
  </g>
</svg>