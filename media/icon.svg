<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E2E"/>
      <stop offset="100%" stop-color="#11111B"/>
    </linearGradient>
    <linearGradient id="jsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600"/>
      <stop offset="100%" stop-color="#F7DF1E"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007ACC" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F7DF1E" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bgGrad)" stroke="#313244" stroke-width="2.5" filter="url(#shadow)"/>

  <!-- Subtle glow inner contour -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="none" stroke="url(#glowGrad)" stroke-width="1.5"/>

  <!-- Fast Runner Speed Trails -->
  <path d="M26 40 H42" stroke="#45475A" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M20 54 H38" stroke="#F7DF1E" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M24 68 H34" stroke="#45475A" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M28 82 H44" stroke="#313244" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Play Arrow / Runner Head -->
  <polygon points="48,34 98,64 48,94" fill="url(#jsGrad)"/>
  
  <!-- Sleek Cutout in Play Arrow -->
  <polygon points="56,47 84,64 56,81" fill="#181825"/>

  <!-- JS Monogram Inside or Bottom Accent -->
  <text x="64" y="69" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="14" fill="#F7DF1E" text-anchor="middle" letter-spacing="0.5">JS</text>

  <!-- Code brackets indicator at bottom right -->
  <text x="96" y="104" font-family="'Consolas', 'Fira Code', monospace" font-weight="bold" font-size="14" fill="#6C7086" text-anchor="end">&lt;/&gt;</text>
</svg>